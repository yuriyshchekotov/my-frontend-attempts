<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Blog</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .header h1 {
            color: #333;
            margin-bottom: 1rem;
        }

        .header p {
            color: #666;
            margin-bottom: 2rem;
        }

        .user-info {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 5px;
            margin-bottom: 2rem;
        }

        .user-name {
            font-weight: 500;
            color: #333;
        }

        .user-role {
            color: #666;
            font-size: 0.9rem;
        }

        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .alert {
            padding: 0.75rem;
            border-radius: 5px;
            margin-bottom: 1rem;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="container">
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Загрузка...</p>
    </div>

    <div id="content" style="display:none;">
        <div class="header">
            <h1>Training Blog</h1>
            <p>Добро пожаловать в ваш учебный блог!</p>
        </div>

        <div id="userInfo" class="user-info" style="display:none;">
            <div class="user-name" id="userName"></div>
            <div class="user-role" id="userRole"></div>
        </div>

        <div id="successMessage" class="alert alert-success" style="display:none;"></div>
        <div id="errorMessage" class="alert alert-error" style="display:none;"></div>

        <div id="actions" class="actions">
            <a href="/my-blog" class="btn btn-primary">Мой блог</a>
            <form method="POST" action="/logout" style="display:inline;">
                <button type="submit" class="btn btn-danger">Выйти</button>
            </form>
        </div>
    </div>

    <div id="loginPrompt" style="display:none;">
        <div class="header">
            <h1>Training Blog</h1>
            <p>Для доступа к блогу необходимо войти в систему</p>
        </div>

        <div class="actions">
            <a href="/login" class="btn btn-primary">Войти</a>
            <a href="/registration" class="btn btn-secondary">Зарегистрироваться</a>
        </div>
    </div>
</div>

</body>
</html>
