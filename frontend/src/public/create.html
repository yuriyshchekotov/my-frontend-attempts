<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новая запись в блоге</title>
    <style>
        body {
            background-color: #A47864;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #2c2c2c;
        }


        .container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 1.5rem;
            background-color: #F3E9E4;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        nav.breadcrumbs {
            margin-bottom: 1rem;
            font-size: 0.9em;
        }

        nav.breadcrumbs a {
            color: #1771ad;
            text-decoration: none;
        }

        nav.breadcrumbs a:hover {
            text-decoration: underline;
        }

        form p {
            margin: 1rem 0;
        }

        input[type="text"],
        textarea,
        input[type="file"] {
            width: 100%;
            padding: 0.5rem;
            margin-top: 0.25rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-family: inherit;
            font-size: 1em;
        }

        .file-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .file-input-wrapper input[type="file"] {
            flex: 1;
        }

        .clear-file {
            margin-left: 0.5rem;
            cursor: pointer;
            color: #a00;
            font-weight: bold;
            font-size: 1.2em;
            border: none;
            background: none;
        }

        button {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            margin-right: 0.5rem;
        }

        button[type="submit"] {
            background-color: #4CAF50;
            color: white;
        }

        button[type="reset"] {
            background-color: #ccc;
            color: #333;
        }

        #status {
            margin-top: 1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <nav class="breadcrumbs">
        <a href="/frontend/src/public">blog</a> / create
    </nav>

    <h1>Новая запись в блоге</h1>

    <form id="createForm" enctype="multipart/form-data">
        <p>
            <label>Заголовок:<br>
                <input type="text" name="title" id="title" required>
            </label>
        </p>
        <p>
            <label>Текст (аннотация):<br>
                <textarea name="text" id="text" rows="5"></textarea>
            </label>
        </p>
        <p>
            <label>Файл (HTML или скриншот):</label>
        <div class="file-input-wrapper">
            <input type="file" name="file" id="file" accept=".html,.htm,.png,.jpg,.jpeg">
            <button type="button" class="clear-file" id="clearFile">&times;</button>
        </div>
        </p>

        <button type="submit">Опубликовать</button>
        <button type="reset">Сбросить</button>
    </form>

    <p id="status"></p>
</div>

<div class="container" style="margin-top: 2rem;">
    <h1>Новая запись прогресса</h1>

    <form id="progressForm">
        <p>
            <label>День:<br>
                <select name="day" id="day" required>
                    <option value="">Выберите день</option>
                    <option value="day-00">day-00</option>
                    <option value="day-01">day-01</option>
                    <option value="day-02">day-02</option>
                    <option value="day-03">day-03</option>
                    <option value="day-04">day-04</option>
                    <option value="day-05">day-05</option>
                    <option value="day-06">day-06</option>
                    <option value="day-07">day-07</option>
                    <option value="day-08">day-08</option>
                    <option value="day-09">day-09</option>
                    <option value="day-10">day-10</option>
                    <option value="day-11">day-11</option>
                    <option value="day-12">day-12</option>
                </select>
            </label>
        </p>
        <p>
            <label>Тема:<br>
                <input type="text" name="topic" id="topic" required>
            </label>
        </p>
        <p>
            <label>Тип сессии:<br>
                <select name="sessionType" id="sessionType" required>
                    <option value="">Выберите тип</option>
                    <option value="чтение">чтение</option>
                    <option value="кодинг">кодинг</option>
                    <option value="мини-проект">мини-проект</option>
                    <option value="повторение">повторение</option>
                </select>
            </label>
        </p>
        <p>
            <label>Практика:<br>
                <textarea name="practice" id="practice" rows="3" required></textarea>
            </label>
        </p>
        <p>
            <label>Файлы (выберите из доступных):<br>
                <div id="filesContainer" style="max-height: 150px; overflow-y: auto; border: 1px solid #ccc; padding: 0.5rem; border-radius: 6px;">
                    <!-- Файлы будут загружены динамически -->
                </div>
            </label>
        </p>
        <p>
            <label>Уверенность (1-5):<br>
                <input type="range" name="confidence" id="confidence" min="1" max="5" value="3" required>
                <span id="confidenceValue">3</span>
            </label>
        </p>
        <p>
            <label>
                <input type="checkbox" name="repeat" id="repeat"> Повторить позже
            </label>
        </p>
        <p>
            <label>Комментарий:<br>
                <textarea name="comment" id="comment" rows="2"></textarea>
            </label>
        </p>

        <button type="submit">Добавить запись</button>
        <button type="reset">Сбросить</button>
    </form>

    <p id="progressStatus"></p>
</div>

<script>
    // Сброс файла крестиком
    document.getElementById("clearFile").addEventListener("click", () => {
        const fileInput = document.getElementById("file");
        fileInput.value = "";
    });

    document.getElementById("createForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const fd = new FormData();
        const title = document.getElementById("title").value.trim();
        const text  = document.getElementById("text").value || '';

        if (!title) {
            document.getElementById("status").textContent = "❌ Укажите заголовок";
            return;
        }

        fd.append("title", title);
        if (text) fd.append("text", text);

        const fileInput = document.getElementById("file");
        const file = fileInput.files && fileInput.files[0];

        if (file) {
            fd.append("file", file);
            const clientPath = `days/.from-form/${file.name}`;
            fd.append("source", clientPath);
        }

        try {
            const resp = await fetch("{{apiUrl}}/articles", {
                method: "POST",
                body: fd
            });

            if (resp.ok) {
                document.getElementById("status").textContent = "✅ Статья опубликована!";
            } else {
                const err = await resp.json().catch(() => ({}));
                document.getElementById("status").textContent = "❌ Ошибка: " + (err.error || resp.statusText);
            }
        } catch (err) {
            console.error(err);
            document.getElementById("status").textContent = "⚠️ Ошибка сети";
        }
    });

    // Обработка формы прогресса
    const confidenceSlider = document.getElementById("confidence");
    const confidenceValue = document.getElementById("confidenceValue");
    
    confidenceSlider.addEventListener("input", () => {
        confidenceValue.textContent = confidenceSlider.value;
    });

    // Загрузка файлов для выбранного дня
    document.getElementById("day").addEventListener("change", async (e) => {
        const day = e.target.value;
        const filesContainer = document.getElementById("filesContainer");
        
        if (!day) {
            filesContainer.innerHTML = "Выберите день для загрузки файлов";
            return;
        }

        try {
            // Здесь можно добавить API для получения списка файлов
            // Пока используем статический список
            const files = await getFilesForDay(day);
            filesContainer.innerHTML = "";
            
            files.forEach(file => {
                const label = document.createElement("label");
                label.style.display = "block";
                label.style.marginBottom = "0.25rem";
                
                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.name = "files";
                checkbox.value = file;
                
                const span = document.createElement("span");
                span.textContent = file;
                span.style.marginLeft = "0.5rem";
                
                label.appendChild(checkbox);
                label.appendChild(span);
                filesContainer.appendChild(label);
            });
        } catch (error) {
            filesContainer.innerHTML = "Ошибка загрузки файлов";
        }
    });

    // Функция для получения файлов дня (заглушка)
    async function getFilesForDay(day) {
        // В реальном приложении здесь был бы API запрос
        const filesByDay = {
            "day-00": ["about-me-copy-for-blog.html", "about-me.html", "dunning-kruger-curve.html", "test.html"],
            "day-01": ["Screenshot from 2025-09-11 07-17-13.png"],
            "day-02": ["semantic.html", "Моё резюме.html"],
            "day-03": ["article.html"],
            "day-04": ["about.html", "contacts.html", "index.html", "navigation.html"],
            "day-05": ["media.html", "portfolio.html"],
            "day-06": ["table.html"],
            "day-07": ["forms.html"],
            "day-08": ["index.html", "styles.css"],
            "day-09": ["css-dinner.png"],
            "day-10": ["colors-backgrounds.html", "homework.html"],
            "day-11": ["terminal-theme.html", "typography-homework.html", "typography.html"],
            "day-12": ["box-model-fixing-blocks.html", "box-model.html"]
        };
        
        return filesByDay[day] || [];
    }

    document.getElementById("progressForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);
        const selectedFiles = Array.from(document.querySelectorAll('input[name="files"]:checked')).map(cb => cb.value);
        
        const progressData = {
            user_id: null,
            day: formData.get("day"),
            topic: formData.get("topic"),
            sessionType: formData.get("sessionType"),
            practice: formData.get("practice"),
            files: selectedFiles,
            confidence: parseInt(formData.get("confidence")),
            repeat: formData.has("repeat"),
            comment: formData.get("comment") || null
        };

        if (!progressData.day || !progressData.topic || !progressData.sessionType || !progressData.practice) {
            document.getElementById("progressStatus").textContent = "❌ Заполните все обязательные поля";
            return;
        }

        try {
            const resp = await fetch("{{apiUrl}}/progress-notes", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(progressData)
            });

            if (resp.ok) {
                document.getElementById("progressStatus").textContent = "✅ Запись прогресса добавлена!";
                e.target.reset();
                document.getElementById("confidenceValue").textContent = "3";
            } else {
                const err = await resp.json().catch(() => ({}));
                document.getElementById("progressStatus").textContent = "❌ Ошибка: " + (err.error || resp.statusText);
            }
        } catch (err) {
            console.error(err);
            document.getElementById("progressStatus").textContent = "⚠️ Ошибка сети";
        }
    });
</script>
</body>
</html>
