<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новая запись в блоге</title>
    <style>
        body {
            background-color: #A47864;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #2c2c2c;
        }


        .container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 1.5rem;
            background-color: #F3E9E4;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        nav.breadcrumbs {
            margin-bottom: 1rem;
            font-size: 0.9em;
        }

        nav.breadcrumbs a {
            color: #1771ad;
            text-decoration: none;
        }

        nav.breadcrumbs a:hover {
            text-decoration: underline;
        }

        form p {
            margin: 1rem 0;
        }

        input[type="text"],
        textarea,
        input[type="file"] {
            width: 100%;
            padding: 0.5rem;
            margin-top: 0.25rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-family: inherit;
            font-size: 1em;
        }

        .file-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .file-input-wrapper input[type="file"] {
            flex: 1;
        }

        .clear-file {
            margin-left: 0.5rem;
            cursor: pointer;
            color: #a00;
            font-weight: bold;
            font-size: 1.2em;
            border: none;
            background: none;
        }

        button {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            margin-right: 0.5rem;
        }

        button[type="submit"] {
            background-color: #4CAF50;
            color: white;
        }

        button[type="reset"] {
            background-color: #ccc;
            color: #333;
        }

        #status {
            margin-top: 1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <nav class="breadcrumbs">
        <a href="/frontend/src/public">blog</a> / create
    </nav>

    <h1>Новая запись в блоге</h1>

    <form id="createForm" enctype="multipart/form-data">
        <p>
            <label>Заголовок:<br>
                <input type="text" name="title" id="title" required>
            </label>
        </p>
        <p>
            <label>Текст (аннотация):<br>
                <textarea name="text" id="text" rows="5"></textarea>
            </label>
        </p>
        <p>
            <label>Файл (HTML или скриншот):</label>
        <div class="file-input-wrapper">
            <input type="file" name="file" id="file" accept=".html,.htm,.png,.jpg,.jpeg">
            <button type="button" class="clear-file" id="clearFile">&times;</button>
        </div>
        </p>

        <button type="submit">Опубликовать</button>
        <button type="reset">Сбросить</button>
    </form>

    <p id="status"></p>
</div>

<script>
    // Сброс файла крестиком
    document.getElementById("clearFile").addEventListener("click", () => {
        const fileInput = document.getElementById("file");
        fileInput.value = "";
    });

    document.getElementById("createForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const fd = new FormData();
        const title = document.getElementById("title").value.trim();
        const text  = document.getElementById("text").value || '';

        if (!title) {
            document.getElementById("status").textContent = "❌ Укажите заголовок";
            return;
        }

        fd.append("title", title);
        if (text) fd.append("text", text);

        const fileInput = document.getElementById("file");
        const file = fileInput.files && fileInput.files[0];

        if (file) {
            fd.append("file", file);
            const clientPath = `days/.from-form/${file.name}`;
            fd.append("source", clientPath);
        }

        try {
            const resp = await fetch("http://localhost:3000/articles", {
                method: "POST",
                body: fd
            });

            if (resp.ok) {
                document.getElementById("status").textContent = "✅ Статья опубликована!";
            } else {
                const err = await resp.json().catch(() => ({}));
                document.getElementById("status").textContent = "❌ Ошибка: " + (err.error || resp.statusText);
            }
        } catch (err) {
            console.error(err);
            document.getElementById("status").textContent = "⚠️ Ошибка сети";
        }
    });
</script>
</body>
</html>
