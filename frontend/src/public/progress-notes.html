<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Записи прогресса</title>
    <style>
        body {
            background-color: #A47864;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #2c2c2c;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 1.5rem;
            background-color: #F3E9E4;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        nav.breadcrumbs {
            margin-bottom: 1rem;
            font-size: 0.9em;
        }

        nav.breadcrumbs a {
            color: #1771ad;
            text-decoration: none;
        }

        nav.breadcrumbs a:hover {
            text-decoration: underline;
        }

        .progress-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .progress-table th,
        .progress-table td {
            border: 1px solid #ccc;
            padding: 0.5rem;
            text-align: left;
        }

        .progress-table th {
            background-color: #e0e0e0;
            font-weight: bold;
        }

        .progress-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .progress-table tr:hover {
            background-color: #f0f0f0;
        }

        .session-type {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .session-type.чтение {
            background-color: #e3f2fd;
            color: #1976d2;
        }

        .session-type.кодинг {
            background-color: #e8f5e8;
            color: #388e3c;
        }

        .session-type.мини-проект {
            background-color: #fff3e0;
            color: #f57c00;
        }

        .session-type.повторение {
            background-color: #fce4ec;
            color: #c2185b;
        }

        .confidence {
            font-weight: bold;
        }

        .confidence-1 { color: #d32f2f; }
        .confidence-2 { color: #f57c00; }
        .confidence-3 { color: #fbc02d; }
        .confidence-4 { color: #689f38; }
        .confidence-5 { color: #388e3c; }

        .files-list {
            font-size: 0.9em;
            color: #666;
        }

        .files-list span {
            display: inline-block;
            background-color: #e0e0e0;
            padding: 0.1rem 0.3rem;
            margin: 0.1rem;
            border-radius: 3px;
        }

        .repeat {
            color: #f57c00;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            font-size: 1.2em;
        }

        .error {
            color: #d32f2f;
            text-align: center;
            padding: 2rem;
        }

        .no-data {
            text-align: center;
            padding: 2rem;
            color: #666;
        }

        button {
            padding: 0.4rem 0.8rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            margin: 0.2rem;
        }

        .btn-delete {
            background-color: #d32f2f;
            color: white;
        }

        .btn-delete:hover {
            background-color: #b71c1c;
        }

        .btn-edit {
            background-color: #1976d2;
            color: white;
        }

        .btn-edit:hover {
            background-color: #1565c0;
        }
    </style>
</head>
<body>

<div class="container">
    <nav class="breadcrumbs">
        <a href="/frontend/src/public">blog</a> / progress-notes
    </nav>

    <h1>Записи прогресса</h1>

    <div id="loading" class="loading">Загрузка записей...</div>
    <div id="error" class="error" style="display: none;"></div>
    <div id="no-data" class="no-data" style="display: none;">Нет записей прогресса</div>

    <table class="progress-table" id="progressTable" style="display: none;">
        <thead>
            <tr>
                <th>ID</th>
                <th>День</th>
                <th>Тема</th>
                <th>Тип</th>
                <th>Практика</th>
                <th>Файлы</th>
                <th>Уверенность</th>
                <th>Повторить</th>
                <th>Комментарий</th>
                <th>Дата</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="progressTableBody">
        </tbody>
    </table>
</div>

<script>
    async function loadProgressNotes() {
        const loading = document.getElementById("loading");
        const error = document.getElementById("error");
        const noData = document.getElementById("no-data");
        const table = document.getElementById("progressTable");

        try {
            const response = await fetch("{{API_URL}}/progress-notes");
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const progressNotes = await response.json();
            
            loading.style.display = "none";
            error.style.display = "none";
            
            if (progressNotes.length === 0) {
                noData.style.display = "block";
                table.style.display = "none";
                return;
            }

            noData.style.display = "none";
            table.style.display = "table";
            renderProgressNotes(progressNotes);
            
        } catch (err) {
            console.error("Error loading progress notes:", err);
            loading.style.display = "none";
            table.style.display = "none";
            noData.style.display = "none";
            error.style.display = "block";
            error.textContent = "Ошибка загрузки записей: " + err.message;
        }
    }

    function renderProgressNotes(progressNotes) {
        const tbody = document.getElementById("progressTableBody");
        tbody.innerHTML = "";

        progressNotes.forEach(note => {
            const row = document.createElement("tr");
            
            // ID
            const idCell = document.createElement("td");
            idCell.textContent = note.id;
            row.appendChild(idCell);

            // День
            const dayCell = document.createElement("td");
            dayCell.textContent = note.day;
            row.appendChild(dayCell);

            // Тема
            const topicCell = document.createElement("td");
            topicCell.textContent = note.topic;
            row.appendChild(topicCell);

            // Тип сессии
            const sessionTypeCell = document.createElement("td");
            const sessionTypeSpan = document.createElement("span");
            sessionTypeSpan.textContent = note.sessionType;
            sessionTypeSpan.className = `session-type ${note.sessionType}`;
            sessionTypeCell.appendChild(sessionTypeSpan);
            row.appendChild(sessionTypeCell);

            // Практика
            const practiceCell = document.createElement("td");
            practiceCell.textContent = note.practice;
            practiceCell.style.maxWidth = "200px";
            practiceCell.style.wordWrap = "break-word";
            row.appendChild(practiceCell);

            // Файлы
            const filesCell = document.createElement("td");
            const filesDiv = document.createElement("div");
            filesDiv.className = "files-list";
            if (note.files && note.files.length > 0) {
                note.files.forEach(file => {
                    const span = document.createElement("span");
                    span.textContent = file;
                    filesDiv.appendChild(span);
                });
            } else {
                filesDiv.textContent = "—";
            }
            filesCell.appendChild(filesDiv);
            row.appendChild(filesCell);

            // Уверенность
            const confidenceCell = document.createElement("td");
            const confidenceSpan = document.createElement("span");
            confidenceSpan.textContent = note.confidence;
            confidenceSpan.className = `confidence confidence-${note.confidence}`;
            confidenceCell.appendChild(confidenceSpan);
            row.appendChild(confidenceCell);

            // Повторить
            const repeatCell = document.createElement("td");
            if (note.repeat) {
                const repeatSpan = document.createElement("span");
                repeatSpan.textContent = "✓";
                repeatSpan.className = "repeat";
                repeatCell.appendChild(repeatSpan);
            } else {
                repeatCell.textContent = "—";
            }
            row.appendChild(repeatCell);

            // Комментарий
            const commentCell = document.createElement("td");
            commentCell.textContent = note.comment || "—";
            commentCell.style.maxWidth = "150px";
            commentCell.style.wordWrap = "break-word";
            row.appendChild(commentCell);

            // Дата
            const dateCell = document.createElement("td");
            const date = new Date(note.date);
            dateCell.textContent = date.toLocaleDateString("ru-RU") + " " + date.toLocaleTimeString("ru-RU", {hour: '2-digit', minute:'2-digit'});
            row.appendChild(dateCell);

            // Действия
            const actionsCell = document.createElement("td");
            const editBtn = document.createElement("button");
            editBtn.textContent = "✏️";
            editBtn.className = "btn-edit";
            editBtn.title = "Редактировать";
            editBtn.onclick = () => editProgressNote(note.id);
            
            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "🗑️";
            deleteBtn.className = "btn-delete";
            deleteBtn.title = "Удалить";
            deleteBtn.onclick = () => deleteProgressNote(note.id);
            
            actionsCell.appendChild(editBtn);
            actionsCell.appendChild(deleteBtn);
            row.appendChild(actionsCell);

            tbody.appendChild(row);
        });
    }

    async function deleteProgressNote(id) {
        if (!confirm("Вы уверены, что хотите удалить эту запись?")) {
            return;
        }

        try {
            const response = await fetch(`{{API_URL}}/progress-notes/${id}`, {
                method: "DELETE"
            });

            if (response.ok) {
                // Перезагружаем таблицу
                await loadProgressNotes();
            } else {
                const error = await response.json().catch(() => ({}));
                alert("Ошибка удаления: " + (error.error || response.statusText));
            }
        } catch (err) {
            console.error("Error deleting progress note:", err);
            alert("Ошибка сети при удалении записи");
        }
    }

    function editProgressNote(id) {
        // Пока простое перенаправление на форму редактирования
        alert("Функция редактирования будет добавлена позже. ID записи: " + id);
    }

    // Загружаем данные при загрузке страницы
    document.addEventListener("DOMContentLoaded", loadProgressNotes);
</script>
</body>
</html>
