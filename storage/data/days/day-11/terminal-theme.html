<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Имитация терминала</title>
    <style>
        body {
            font-family: sans-serif;
            background: #2b2b2b;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            gap: 1rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
        }

        select {
            padding: 0.3rem;
        }

        .terminal {
            width: 600px;
            height: 300px;
            border-radius: 6px;
            overflow-y: auto;
            padding: 0.5rem 1rem;
            position: relative;
            white-space: pre-wrap;
            outline: none;
        }

        .clock {
            position: absolute;
            top: 5px;
            right: 10px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* Выделение: инверсия цветов */
        .terminal::selection {
            background: var(--fg);
            color: var(--bg);
        }
        .terminal *::selection {
            background: var(--fg);
            color: var(--bg);
        }

        /* Темы */
        .dracula {
            --bg: #282a36;
            --fg: #f8f8f2;
        }

        .gruvbox {
            --bg: #282828;
            --fg: #ebdbb2;
        }

        .solarized {
            --bg: #002b36;
            --fg: #839496;
        }

        .terminal {
            /* дефолтное значение */
            --font: "FiraCode Nerd Font Mono", "FiraCode Nerd Font", "FiraCode Nerd Font Propo", monospace;
            background: var(--bg);
            caret-color: var(--fg);
            color: var(--fg);
            font-family: var(--font, monospace);
        }
    </style>
</head>
<body>
<div class="controls">
    <label>Шрифт:
        <select id="fontSelect">
            <option value='"Fira Code", monospace'>Fira Code</option>
            <option value='"FiraCode Nerd Font Mono","FiraCode Nerd Font","FiraCode Nerd Font Propo",monospace'>Fira Nerd Code</option>
            <option value='"Courier New", monospace'>Courier New</option>
            <option value='"JetBrains Mono", monospace'>JetBrains Mono</option>
        </select>
    </label>

    <label>Тема:
        <select id="themeSelect">
            <option value="dracula">Dracula</option>
            <option value="gruvbox">Gruvbox</option>
            <option value="solarized">Solarized</option>
        </select>
    </label>
</div>

<div id="terminal" class="terminal dracula" contenteditable="true">
    <div class="clock"> 01:23:45</div>
    $ _
</div>

<script>
    const terminal = document.getElementById('terminal');
    const fontSelect = document.getElementById('fontSelect');
    const themeSelect = document.getElementById('themeSelect');

    fontSelect.addEventListener('change', () => {
        terminal.style.setProperty('--font', fontSelect.value);
    });

    themeSelect.addEventListener('change', () => {
        terminal.className = 'terminal ' + themeSelect.value;
    });

    terminal.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            e.preventDefault();
            terminal.innerHTML += "\nЯ имитация. Так что нет.\n$ ";
            const range = document.createRange();
            const sel = window.getSelection();
            const node = terminal.childNodes[terminal.childNodes.length - 1];
            range.setStart(node, node.length);
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
        }
    });
</script>
</body>
</html>
