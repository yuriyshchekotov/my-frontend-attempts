<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
initial-scale=1.0">
    <title>Все элементы форм</title>
    <style>
        form {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        fieldset {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #aaa;
        }
        legend {
            font-weight: bold;
            padding: 0 10px;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        input, select, textarea {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<h1>Демонстрация всех элементов форм</h1>
<form action="/submit" method="POST">
    <!-- Текстовые поля -->
    <fieldset>
        <legend>Текстовые поля</legend>
        <label>Текстовое поле: <input type="text"
                                      name="text" placeholder="Введите текст"></label>
        <label>Поле поиска: <input type="search"
                                   name="search" placeholder="Поиск..."></label>
        <label>Телефон: <input type="tel"
                               name="phone" placeholder="+7 (999) 999-99-99"></label>
        <label>URL: <input type="url" name="url"
                           placeholder="https://example.com"></label>
        <label>Пароль: <input type="password"
                              name="password" placeholder="Пароль"></label>
        <label>Сообщение:
            <textarea name="message" rows="3"
                      cols="50" placeholder="Введите сообщение"></textarea>
        </label>
    </fieldset>
    <!-- Элементы выбора -->
    <fieldset>
        <legend>Элементы выбора</legend>
        <label>Чекбоксы:</label>
        <label><input type="checkbox" name="option1"
                      value="1"> Вариант 1</label>
        <label><input type="checkbox" name="option2"
                      value="2"> Вариант 2</label>
        <label>Радиокнопки:</label>
        <label><input type="radio" name="gender"
                      value="male"> Мужской</label>
        <label><input type="radio" name="gender"
                      value="female"> Женский</label>
        <label>Выпадающий список:
            <select name="country">
                <option value="">-- Выберите страну
                    --</option>
                <option value="ru">Россия</option>
                <option value="us">США</option>
                <option value="de">Германия</option>
            </select>
        </label>
        <label>Множественный выбор:
            <select name="colors" multiple size="3">
                <option value="red">Красный</option>
                <option
                        value="green">Зеленый</option>
                <option value="blue">Синий</option>
            </select>
        </label>
    </fieldset>
    <!-- Специальные поля -->
    <fieldset>
        <legend>Специальные поля</legend>
        <label>Email: <input type="email"
                             name="email" placeholder="email@example.com"></label>
        <label>Число: <input type="number"
                             name="age" min="0" max="120" step="1"></label>
        <label>Диапазон: <input type="range"
                                name="volume" min="0" max="100"></label>
        <label>Дата: <input type="date" name="date">
        </label>
        <label>Время: <input type="time"
                             name="time"></label>
        <label>Дата и время: <input type="datetimelocal" name="datetime"></label>
        <label>Неделя: <input type="week"
                              name="week"></label>
        <label>Месяц: <input type="month"
                             name="month"></label>
        <label>Цвет: <input type="color"
                            name="color"></label>
        <label>Файл: <input type="file" name="file">
        </label>
        <label>Несколько файлов: <input type="file"
                                        name="files" multiple></label>
    </fieldset>
    <!-- Дополнительные элементы -->
    <fieldset>
        <legend>Дополнительные элементы</legend>
        <label>Прогресс:
            <progress value="70" max="100">70%
            </progress>
        </label>
        <label>Измеритель:
            <meter value="0.6">60%</meter>
        </label>
        <label>Список подсказок:
            <input list="browsers" name="browser">
            <datalist id="browsers">
                <option value="Chrome">
                <option value="Firefox">
                <option value="Safari">
                <option value="Edge">
                <option value="Opera">
            </datalist>
        </label>
    </fieldset>
    <!-- Кнопки -->
    <fieldset>
        <legend>Кнопки</legend>
        <input type="submit" value="Отправить
форму">
        <input type="reset" value="Очистить форму">
        <input type="button" value="Обычная кнопка">
        <button type="submit">Кнопка button</button>
    </fieldset>
</form>
</body>
</html>
