openapi: 3.1.0
info:
  title: Training Blog API
  version: 1.1.0
  description: API для учебного блога на TypeScript + Express

servers:
  - url: http://localhost:3000

paths:
  /articles:
    get:
      summary: Получить список всех статей
      operationId: getArticles
      responses:
        "200":
          description: Список статей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"

    post:
      summary: Создать новую статью
      operationId: createArticle
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 50
                  description: Заголовок статьи (plain text)
                text:
                  type: string
                  maxLength: 500
                  nullable: true
                  description: Короткое описание/аннотация (plain text)
                source:
                  type: string
                  nullable: true
                  description: >
                    Относительный путь, который фронт предзаполняет для загруженного файла:
                    "days/.from-form/${fileName}". Сервер всё равно пересчитает и нормализует путь.
                file:
                  type: string
                  format: binary
                  nullable: true
                  description: >
                    Один файл: либо .html/.htm (тогда будет использован как source),
                    либо .png/.jpg/.jpeg (тогда будет использован как screenshot).
            encoding:
              text:
                contentType: text/plain; charset=utf-8
              title:
                contentType: text/plain; charset=utf-8
              source:
                contentType: text/plain; charset=utf-8
      responses:
        "201":
          description: Успешно созданная статья
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          description: Ошибка валидации входных данных

components:
  schemas:
    Article:
      type: object
      required: [id, date, title]
      properties:
        id:
          type: number
          example: 1
        date:
          type: string
          format: date-time
          example: "2025-09-13T18:30:00Z"
        title:
          type: string
        text:
          type: string
          nullable: true
        screenshot:
          type: string
          nullable: true
          description: Относительный путь (например, "days/.from-form/pic.jpg")
        source:
          type: string
          nullable: true
          description: Относительный путь (например, "days/.from-form/page.html")
        content:
          type: string
          nullable: true
          description: HTML-фрагмент (обычно из body) — может заполняться сервером для превью
