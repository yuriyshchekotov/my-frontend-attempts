openapi: 3.1.0
info:
  title: Training Blog API
  version: 1.2.0
  description: >
    API для учебного блога с авторизацией пользователей (JWT) и разграничением прав доступа.
    Поддерживает роли student и admin.

servers:
  - url: http://localhost:3001

paths:
  /auth/login:
    post:
      summary: Авторизация пользователя (вход)
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                email:
                  type: string
                  format: email
                  nullable: true
                  example: "user@example.com"
                name:
                  type: string
                  nullable: true
                  example: "student1"
                password:
                  type: string
                  example: "mypassword"
      responses:
        "200":
          description: Успешная авторизация
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    description: JWT токен доступа
                  user:
                    $ref: "#/components/schemas/UserPublic"
        "401":
          description: Неверные данные или пользователь не найден

  /auth/register:
    post:
      summary: Регистрация нового пользователя
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirmPassword]
              properties:
                email:
                  type: string
                  format: email
                  nullable: true
                name:
                  type: string
                  nullable: true
                password:
                  type: string
                  minLength: 6
                confirmPassword:
                  type: string
                  minLength: 6
      responses:
        "201":
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  user:
                    $ref: "#/components/schemas/UserPublic"
        "400":
          description: Ошибка валидации входных данных

  /users:
    get:
      summary: Получить список всех пользователей (только для админа)
      operationId: getUsers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Список пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserPublic"
        "403":
          description: Доступ запрещён
    post:
      summary: Создать нового пользователя (только для админа)
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUser"
      responses:
        "201":
          description: Создан пользователь
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "403":
          description: Доступ запрещён

  /articles:
    get:
      summary: Получить список статей
      operationId: getArticles
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
          description: >
            Для админа — фильтрация по пользователю.
            Для студента — игнорируется, всегда возвращаются только свои статьи.
      responses:
        "200":
          description: Список статей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"
        "401":
          description: Неавторизован
    post:
      summary: Создать новую статью (для текущего пользователя)
      operationId: createArticle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 50
                text:
                  type: string
                  maxLength: 500
                  nullable: true
                source:
                  type: string
                  nullable: true
                  description: Относительный путь ("days/.from-form/${fileName}")
                file:
                  type: string
                  format: binary
                  nullable: true
      responses:
        "201":
          description: Успешно созданная статья
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "401":
          description: Неавторизован
        "400":
          description: Ошибка валидации входных данных

  /progress-notes:
    get:
      summary: Получить список записей прогресса
      operationId: getProgressNotes
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
          description: >
            Для админа — фильтрация по пользователю.
            Для студента — игнорируется, возвращаются только свои записи.
      responses:
        "200":
          description: Список записей прогресса
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgressNote"
        "401":
          description: Неавторизован

    post:
      summary: Создать новую запись прогресса
      operationId: createProgressNote
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewProgressNote"
      responses:
        "201":
          description: Успешно созданная запись
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressNote"
        "400":
          description: Ошибка валидации входных данных
        "401":
          description: Неавторизован

  /progress-notes/{id}:
    get:
      summary: Получить запись прогресса по ID
      operationId: getProgressNoteById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Запись прогресса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressNote"
        "404":
          description: Запись не найдена
        "403":
          description: Нет доступа к записи
        "401":
          description: Неавторизован

    put:
      summary: Обновить запись прогресса
      operationId: updateProgressNote
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProgressNote"
      responses:
        "200":
          description: Обновленная запись прогресса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressNote"
        "403":
          description: Нет доступа к записи
        "404":
          description: Запись не найдена
        "401":
          description: Неавторизован
        "400":
          description: Ошибка валидации входных данных

    delete:
      summary: Удалить запись прогресса
      operationId: deleteProgressNote
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Запись успешно удалена
        "404":
          description: Не найдена
        "403":
          description: Нет доступа
        "401":
          description: Неавторизован

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      required: [id, name, passwordHash, role, createdAt, updatedAt]
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          nullable: true
          example: "user@example.com"
        name:
          type: string
          example: "student1"
        passwordHash:
          type: string
          description: Хэш пароля
        role:
          type: string
          enum: [student, admin]
          default: student
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserPublic:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: integer
        email:
          type: string
          nullable: true
        name:
          type: string
        role:
          type: string
          enum: [student, admin]

    NewUser:
      type: object
      required: [name, password]
      properties:
        email:
          type: string
          nullable: true
        name:
          type: string
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum: [student, admin]
          default: student

    Article:
      type: object
      required: [id, date, title, user_id]
      properties:
        id:
          type: integer
        user_id:
          type: integer
          example: 1
        date:
          type: string
          format: date-time
        title:
          type: string
        text:
          type: string
          nullable: true
        screenshot:
          type: string
          nullable: true
          description: Путь с учётом user-префикса, например "user/1/days/day-01/screenshot.png"
        source:
          type: string
          nullable: true
          description: Путь с учётом user-префикса, например "user/1/days/day-01/source.html"
        content:
          type: string
          nullable: true
          description: Экранированный HTML для предпросмотра

    ProgressNote:
      type: object
      required: [id, user_id, date, day, topic, sessionType, practice, confidence, repeat]
      properties:
        id:
          type: integer
        user_id:
          type: integer
          example: 1
        date:
          type: string
          format: date-time
        day:
          type: string
        topic:
          type: string
        sessionType:
          type: string
          enum: ["чтение", "кодинг", "мини-проект", "повторение"]
        practice:
          type: string
        files:
          type: array
          items:
            type: string
        confidence:
          type: number
          minimum: 1
          maximum: 5
        repeat:
          type: boolean
        comment:
          type: string
          nullable: true

    NewProgressNote:
      type: object
      required: [day, topic, sessionType, practice, confidence, repeat]
      properties:
        date:
          type: string
          format: date-time
        day:
          type: string
        topic:
          type: string
        sessionType:
          type: string
          enum: ["чтение", "кодинг", "мини-проект", "повторение"]
        practice:
          type: string
        files:
          type: array
          items:
            type: string
        confidence:
          type: number
          minimum: 1
          maximum: 5
        repeat:
          type: boolean
        comment:
          type: string
          nullable: true

    UpdateProgressNote:
      type: object
      properties:
        date:
          type: string
          format: date-time
        day:
          type: string
        topic:
          type: string
        sessionType:
          type: string
          enum: ["чтение", "кодинг", "мини-проект", "повторение"]
        practice:
          type: string
        files:
          type: array
          items:
            type: string
        confidence:
          type: number
          minimum: 1
          maximum: 5
        repeat:
          type: boolean
        comment:
          type: string
          nullable: true
